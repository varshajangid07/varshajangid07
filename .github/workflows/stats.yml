name: Generate Stats Card
on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate stats card (Light Mode)
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=default&hide_border=true'
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN }}
          
      - name: Generate stats card (Dark Mode)
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true'
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Fetch Streak Card (Light Mode)
        run: curl -o profile/streak-light.svg "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=default&hide_border=true"

      - name: Fetch Streak Card (Dark Mode)
        run: curl -o profile/streak-dark.svg "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true"
          
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profile/stats-light.svg profile/stats-dark.svg profile/streak-light.svg profile/streak-dark.svg
          git commit -m "Update GitHub Stats and Streak for Light/Dark modes" || exit 0
          git push
